services:
  pyspark-jupyter:
    build: .
    container_name: freshkart-pyspark
    ports:
      - "8888:8888"  # Jupyter Lab
      - "8080:8080"  # VS Code (code-server)
    volumes:
      # Monter uniquement les dossiers nécessaires pour le travail
      - ./data:/workspace/data:ro  # Données en lecture seule
      - ./notebooks:/workspace/notebooks  # Notebooks Jupyter
      - ./projects:/workspace/projects  # Projet FreshKart migration
      - ./scripts:/workspace/scripts:ro  # Scripts utilitaires
      # Pas besoin de monter: venv, .git, .github, docker-*, etc.
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
    restart: unless-stopped
    user: sparkuser
